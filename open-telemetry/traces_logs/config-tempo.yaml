server:
  http_listen_port: 3200  # Tempo HTTP API — Grafana queries traces here
  grpc_listen_port: 9095  # Tempo gRPC API — used by Grafana's grafana-apiserver component

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"  # Accept incoming spans from OTel Collector via OTLP/HTTP

storage:
  trace:
    backend: local          # Store trace blocks on the local filesystem (demo only; use object storage in production)
    local:
      path: /tmp/tempo/blocks
