apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    uid: tempo          # referenced by Loki's derivedFields to link logs → traces
    access: proxy
    url: http://tempo:3200        # Tempo HTTP API for TraceQL queries
    isDefault: true
    jsonData:
      grpcEndpoint: tempo:9095    # Tempo gRPC API — required for Grafana's Traces tab

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100         # Loki HTTP API for LogQL queries
    jsonData:
      derivedFields:
        # Match the trace_id structured metadata field that Loki stores when
        # logs arrive via OTLP ingest (traceId from the OTLP record becomes
        # the "trace_id" label/metadata field — it is NOT in the log body text).
        - name: TraceID
          datasourceUid: tempo
          type: label                # match a Loki label or structured metadata field
          matcherRegex: 'trace[_]?id' # regex against label keys; matches trace_id / traceid
          url: '${__value.raw}'

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090   # Prometheus HTTP API for PromQL queries
