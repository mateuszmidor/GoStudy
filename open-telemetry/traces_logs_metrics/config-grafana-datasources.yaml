---
apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    jsonData:
      grpcEndpoint: tempo:9095
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace[_]?id
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: View Trace
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
