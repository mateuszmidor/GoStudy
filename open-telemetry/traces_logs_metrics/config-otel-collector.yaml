# Receive OTLP data (traces + logs + metrics) from the Go app over HTTP
receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"  # Go app sends all telemetry to localhost:4318

# Forward data to the appropriate backend
exporters:
  otlp_http/tempo:
    endpoint: "http://tempo:4318"  # Tempo OTLP ingest port

  otlp_http/loki:
    endpoint: "http://loki:3100/otlp"  # Loki OTLP ingest path

  prometheus:
    endpoint: "0.0.0.0:8889"  # Prometheus scrapes /metrics from this port of OTel Collector

# Batch spans/logs/metrics before exporting to reduce network overhead
processors:
  batch:

# Wire receivers → processors → exporters per signal type
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
