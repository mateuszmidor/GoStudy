apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    uid: tempo          # referenced by Loki's derivedFields to link logs → traces
    access: proxy
    url: http://tempo:3200        # Tempo HTTP API for TraceQL queries
    isDefault: true
    jsonData:
      grpcEndpoint: tempo:9095    # Tempo gRPC API — required for Grafana's Traces tab

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100         # Loki HTTP API for LogQL queries
    jsonData:
      derivedFields:
        # Extract traceID from JSON log lines and render a "Open in Tempo" link
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '"traceID":"(\w+)"'
          url: '${__value.raw}'
